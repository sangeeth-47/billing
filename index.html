  #billingapplogin {
  height: 100%;
}

#billingapplogin html,
#billingapplogin body {
  height: 100%;
}

#billingapplogin {
  margin: 0;
  padding: 0;
  overflow: hidden;
  -ms-overflow-style: none;
  overscroll-behavior: none;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

#billingapplogin main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  box-sizing: border-box;
}

#billingapplogin #loginForm {
  max-height: 100vh;
  overflow: auto;
  backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.05);
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
  width: 100%;
  max-width: 400px;
  text-align: center;
  animation: fadeInZoom 0.8s ease;
}

#billingapplogin #loginForm input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: none;
  border-radius: 5px;
  font-size: 14px;
  background: rgba(255,255,255,0.1);
  color: white;
}

#billingapplogin #loginForm input::placeholder {
  color: #ccc;
}

#billingapplogin #loginForm button {
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  background: #00bcd4;
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 10px #00bcd4;
  transition: 0.3s;
}

#billingapplogin #loginForm button:hover {
  background: #00e5ff;
  box-shadow: 0 0 15px #00e5ff;
}

#billingapplogin .loader {
  width: 20px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 5px solid;
  border-color: #00ffff #00000000;
  animation: l1 0.8s linear infinite;
  margin: 20px auto;
}

@keyframes l1 {
  to {
    transform: rotate(1turn);
  }
}

#billingapplogin .disclaimer-banner {
  position: relative;
  white-space: nowrap;
  overflow: hidden;
  width: 100%;
  height: 30px;
}

#billingapplogin .disclaimer-banner span {
  display: inline-block;
  padding-left: 100%;
  animation: scroll 12s linear infinite, glow 2s ease-in-out infinite alternate;
  color: #ffffff;
  font-size: 12px;
  font-weight: bold;
}

#billingapplogin #toastContainer {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
}

#billingapplogin .toast {
  background-color: #333;
  color: #fff;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(255,255,255,0.2);
  opacity: 0.95;
  animation: fadeOutRight 10s ease forwards;
}

#billingapplogin .watermark-logo {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 80vw;
  max-width: 400px;
  background-image: url('https://billing.sangeeth47.in/assets/logo.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  transform: translate(-50%, -50%);
  z-index: 0;
  pointer-events: none;
}

#billingapplogin .intro-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0f2027;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOutIntro 1s ease 2.5s forwards;
}

#billingapplogin .intro-logo {
  width: 50vw;
  animation: zoomIn 1.5s ease;
}

@keyframes zoomIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes fadeOutIntro {
  to { opacity: 0; visibility: hidden; pointer-events: none; }
}
.glow-on-hover {
      transition: all 0.3s ease;
    }
    .glow-on-hover:hover {
      text-shadow: 0 0 5px #a28cf8, 0 0 10px #a28cf8, 0 0 20px #f8a7ff;
      color: #ffffff;
    }
    @keyframes boxGlowPulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(123, 93, 244, 0.2), 0 0 30px rgba(211, 114, 255, 0.15);
      }
      50% {
        box-shadow: 0 0 30px rgba(168, 120, 255, 0.4), 0 0 50px rgba(248, 167, 255, 0.25);
      }
    }
    .app-glow-on-hover {
      animation: glow-pulse 1s ease-in-out infinite alternate;
    }
    @keyframes glow-pulse {
  0% {
    text-shadow: 0 0 10px #a28cf8, 0 0 10px #a28cf8, 0 0 20px #f8a7ff;
    transform: scale(1);
  }
  100% {
    text-shadow: 0 0 15px #a28cf8, 0 0 25px #f8a7ff, 0 0 35px #f8a7ff;
    transform: scale(1.08);
  }
}

<!-- Cancel Invoice Modal -->
<div id="cancelInvoiceModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;" onclick="if(event.target.id === 'cancelInvoiceModal') closeCancelModal()">
  <div style="background: white; padding: 20px; border-radius: 8px; max-width: 400px; width: 90%; color: #333;">
    <h3 style="margin-top: 0;">Cancel Invoice</h3>
    <label style="display: block; margin-bottom: 10px; font-weight: bold;">Reason for cancellation:</label>
    <textarea id="cancelReasonInput" placeholder="Enter reason..." style="width: 100%; height: 100px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: Arial; box-sizing: border-box;"></textarea>
    <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
      <button onclick="closeCancelModal()" style="padding: 8px 16px; border: 1px solid #ccc; background: #f0f0f0; cursor: pointer; border-radius: 4px;">Cancel</button>
      <button onclick="submitCancelInvoiceFromModal()" style="padding: 8px 16px; color: #dc3545; border: none; cursor: pointer; border-radius: 4px; background: transparent;">Confirm Cancel</button>
    </div>
  </div>
</div>

    <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">

<!-- Search Invoice -->
<template id="searchInvoiceTpl">
  <div class="si-page">
  <h2 id="si-title">Search Invoices</h2>
  <button id="si-backBtn" onclick="loadBillingApp()">Back to Dashboard</button>

  <div id="si-loadingOverlay">
    <div class="si-clock-loader"></div>
  </div>

  <div class="si-button-group">
    <input type="text" id="si-searchInput" placeholder="Enter mobile or vehicle no">
    <button id="si-searchBtn" onclick="si_searchInvoice()">Search</button>
    <button id="si-lastBtn" onclick="si_showLastInvoices()">Reload Recent Invoices</button>
  </div>

  <div class="si-button-group">
    <label>From Date: <input type="date" id="si-fromDate"></label>
    <label>To Date: <input type="date" id="si-toDate"></label>
    <button id="si-dateBtn" onclick="si_fetchInvoicesByDate()">Fetch Invoices by Date</button>
  </div>

  <div id="si-invoiceOptions"></div>
  <div id="si-listStatus" style="text-align:center; margin-top:14px; margin-bottom:20px; font-size:13px; color:#b3ecff; min-height:20px;">

  <div id="si-paymentModal" class="si-modal">
  <div class="si-modal-content">

    <h3>Enter Payment</h3>

    <label>Amount</label>
    <input type="number" id="si-pay-amount" />

    <label>Payment Method</label>
    <select id="si-pay-mode">
      <option value="UPI" selected>UPI</option>
      <option value="Cash">Cash</option>
      <option value="Card">Card</option>
    </select>

    <label>Remarks</label>
    <textarea id="si-pay-remarks" placeholder="Optional..."></textarea>

    <div class="si-modal-actions">
      <button onclick="si_submitPayment()">Submit</button>

  </div>
</div>
